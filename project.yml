name: Horizon

options:
  bundleIdPrefix: com.stephanieraymos
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  generateEmptyDirectories: true

schemes:
  Horizon:
    build:
      targets:
        Horizon: all
    run:
      config: Debug
    archive:
      config: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FZ5HL2XU6U
    # Version rule — the bump must match the size of the change:
    #   BUMP=major  (2.0.0)  tab-structure change, redesign, a whole new pillar feature
    #   BUMP=minor  (1.1.0)  a medium feature — new screen, new capability
    #   (default)   (1.0.1)  small features, bug fixes, polish
    # `BUMP=minor make ship`. The default is PATCH, so a real feature ships looking
    # like a bug fix unless you say otherwise. Largest change in the ship decides.
    # Only the iOS script bumps; ship-mac reuses the version it wrote.
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
  AppShellKit:
    path: ../AppShellKit
  DuoKit:
    path: ../DuoKit

targets:
  Horizon:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Horizon/Sources
      - path: Horizon/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephanieraymos.horizon
        INFOPLIST_FILE: "Horizon/Info.plist"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Mac Catalyst: one app for iPhone/iPad/Mac, sharing the iOS bundle id
        # (Universal Purchase). The Mac build attaches to the same App Store record.
        SUPPORTS_MACCATALYST: "YES"
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # Mac App Store requires the App Sandbox; scope the entitlements to the
        # macOS (Catalyst) SDK only so the iOS build is unaffected.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Horizon/Horizon-Mac.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Supabase
        product: Supabase
      - package: AppShellKit
        product: AppShellKit
      - package: DuoKit
        product: DuoKit

